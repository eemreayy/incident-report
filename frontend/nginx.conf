# Serves the built application and puts the API on the same origin (ADR-025).
#
# Because the browser only ever talks to this server, no CORS configuration
# exists anywhere in the backend and no absolute API address exists anywhere in
# the frontend source. The cost is this file.

server {
    # 3000, not 80: the image runs unprivileged and cannot bind a low port.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. It is needed because every proxy_pass below goes
    # through a variable, and that is deliberate: nginx resolves a literal
    # upstream name once, at startup, and refuses to start if it cannot. That
    # made the interface unavailable whenever the backend was - a backend
    # failure took the whole page down instead of one panel, which is the
    # opposite of what FR-28 asks for. With a variable the name is resolved per
    # request, so this server starts and serves the application even with no
    # backend at all, and API calls simply fail with 502 until it returns.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The SSE endpoint. Its own location block, matched before the general /api/
    # one because nginx prefers the longer prefix.
    #
    # proxy_buffering must be off. With buffering on, nginx holds events until
    # its buffer fills, so the stream stays silent and looks dead while the
    # server is in fact publishing - the single most likely way to break the
    # live update requirement (FR-13) without any error appearing anywhere.
    location /api/v1/stream/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # A stream is meant to stay open; the default 60s would cut it.
        proxy_read_timeout 1h;
    }

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only the health endpoint is exposed, not all of /actuator: the rest is
    # operational surface and has no reason to be reachable from a browser.
    location = /actuator/health {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Single-page application: the two detail screens are addressable (PRD 5.4),
    # so a deep link must return index.html rather than 404 and let the router
    # resolve the path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
