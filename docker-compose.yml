# Full-system composition: the single entry point that brings the whole system
# up with `docker compose up --build` from the repository root (NFR-03).
#
# It does NOT redefine the backend's services. `include` pulls in the backend
# module's own compose file as-is, so the app, PostgreSQL and MongoDB have
# exactly one definition and it lives next to the code that owns them.
# Relative paths inside an included file resolve against that file's own
# directory, so the backend build context stays correct.
#
# The backend module stays independently runnable: `cd backend && docker compose up`
# starts the backend and its databases without the rest of the system.

name: incident-report

include:
  - path: backend/docker-compose.yml

services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incident-report-frontend
    restart: unless-stopped
    depends_on:
      # Wait for the API to report healthy. The frontend would serve fine
      # without it, but the first thing a user does is load data.
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      # 127.0.0.1 rather than localhost: the container resolves localhost to ::1
      # first and nginx listens on IPv4 only.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

# There is deliberately no API address configured above. The browser reaches the
# API on this same origin: nginx inside this container proxies /api and
# /actuator/health to `backend:8080` over the compose network (ADR-025). So the API
# never appears in a URL the browser can see, there is no CORS configuration in
# the backend, and the user opens exactly one address - http://localhost:3000.
#
# Publishing the backend on 8080 stays useful for curl, Postman and the `local`
# profile, but the frontend does not go through it.
