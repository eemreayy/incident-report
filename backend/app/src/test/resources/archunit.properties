# A rule whose "that()" clause matches no class reports success by default in ArchUnit only if
# this is switched off. Most modules still have no classes, so leaving it on would fail the build
# for rules that are simply not applicable yet.
#
# The risk this creates - a mistyped package name makes a rule pass vacuously - is covered by
# ArchitectureRulesTest.projectClassesAreActuallyBeingAnalysed.
#
# Revisit once every module has production code: switching this back on turns "rule not applicable"
# into an error, which is the stricter and eventually correct setting.
archRule.failOnEmptyShould=false
