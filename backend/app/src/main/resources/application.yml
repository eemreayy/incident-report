spring:
  application:
    name: incident-report
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

  jpa:
    hibernate:
      # Flyway owns the schema. `validate` turns a mismatch between the entities and the
      # migrations into a startup failure instead of a runtime surprise.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    # Migrations live in the analysis module, which owns PostgreSQL (ADR-002).
    locations: classpath:db/migration

# Generated from the controllers, not written by hand (NFR-07). The UI is served at a short path
# so it is memorable; the JSON document keeps springdoc's conventional address so tooling finds it.
springdoc:
  swagger-ui:
    path: /swagger-ui
    # Alphabetical rather than declaration order, so the list does not reshuffle when a controller
    # is edited.
    tagsSorter: alpha
    operationsSorter: alpha
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
  error:
    # Errors are returned as RFC 7807 problem+json (T-06). The default Whitelabel body is off:
    # no stack trace and no internal message may leak to the client.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.emreay.incidentreport: INFO

# Application-specific settings. The event type catalog (T-08) and the analysis thresholds
# will be added here.
incident-report:
  ingestion:
    # Maximum accepted length of the raw text; used by the T-06 request validation.
    max-text-length: 10000
  realtime:
    # How long one SSE subscription may stay open. The browser reconnects by itself and the
    # stream carries no data, so this costs a client nothing; it bounds how long a connection
    # the server failed to clean up can survive.
    stream-timeout: 30m
    # How often a comment is written to every open subscription. Short enough that idle proxies
    # do not close the connection, and it is what makes an abruptly closed client detectable.
    heartbeat-interval: 20s
